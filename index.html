<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#180b27" />
    <meta
      name="description"
      content="A Diwali greeting from Shreshth Srivastav"
    />
    <title>Happy Diwali | Shreshth Srivastav</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@500;600;700&family=DM+Sans:wght@400;500;700&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <main class="card" id="card">
      <div class="stars" aria-hidden="true"></div>
      <div class="glow glow-one" aria-hidden="true"></div>
      <div class="glow glow-two" aria-hidden="true"></div>

      <section class="intro" id="intro" aria-label="Diwali greeting cover">
        <p class="eyebrow">A little light for you</p>
        <div class="diya-wrap" aria-hidden="true">
          <div class="flame"></div>
          <div class="flame-inner"></div>
          <div class="diya">
            <span></span>
          </div>
          <div class="diya-shadow"></div>
        </div>
        <h1>Happy<br /><em>Diwali</em></h1>
        <p class="hint">Tap the diya to open your wish</p>
        <button class="open-button" id="openButton" type="button">
          <span>Open your greeting</span>
          <span aria-hidden="true">→</span>
        </button>
      </section>

      <section class="message" id="message" aria-live="polite">
        <p class="eyebrow">शुभ दीपावली</p>
        <div class="rangoli" aria-hidden="true">
          <span></span><span></span><span></span><span></span><span></span
          ><span></span><span></span><span></span>
        </div>
        <h2>May your life<br />shine <em>brightly.</em></h2>
        <p class="wish">
          May the glow of a thousand diyas fill your home with joy, peace and
          prosperity. Wishing you and your loved ones a beautiful Diwali.
        </p>
        <div class="signature">
          <span>With warm wishes</span>
          <strong>Shreshth Srivastav</strong>
        </div>
        <button class="replay-button" id="replayButton" type="button">
          View again
        </button>
      </section>
    </main>
    <script src="script.js"></script>
  </body>
</html>
